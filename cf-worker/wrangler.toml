name = "mygoldrates-cron"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare cron times are UTC. IST = UTC + 5:30. One trigger (the free plan
# allows five in all) wakes the Worker at :00, :07, :17, :30 and :47 past every
# hour; worker.js's PLAN says what is due at that minute:
#   03:30-15:30 UTC every 30 min = 09:00-21:00 IST  fetch-rates (11:00 IST sends the email)
#   03:17 UTC = 08:47 IST news   05:47 = 11:17 rates   09:17 = 14:47 pulse   11:47 = 17:17 deals
#   13:07 UTC = 18:37 IST reel (only if one is saved for the day)
#   13:47 UTC = 19:17 IST awareness (Tue, Thu, Sat)
[triggers]
crons = ["0,7,17,30,47 * * * *"]
