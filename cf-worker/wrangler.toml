name = "mygoldrates-cron"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare cron times are UTC. IST = UTC + 5:30.
#   30 5  UTC = 11:00 IST  (morning: refresh rates + send daily email)
#   30 8  UTC = 14:00 IST  (afternoon revision)
#   30 11 UTC = 17:00 IST  (late revision)
[triggers]
crons = ["30 5 * * *", "30 8 * * *", "30 11 * * *"]
