<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff}
body{background:radial-gradient(120% 80% at 50% 0%,#3a2a12 0%,#1a1208 55%,#0d0904 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 55%,rgba(231,191,90,.18),transparent 70%)}
.hd{position:absolute;top:70px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px}
.hd img{width:96px;height:96px;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.hd b{font:800 52px 'Playfair Display',serif;letter-spacing:.5px;background:linear-gradient(180deg,#ffe9a8,#e7bf5a 55%,#b8862a);-webkit-background-clip:text;color:transparent}
.tag{position:absolute;top:196px;left:0;right:0;text-align:center;font:600 40px Poppins;color:#ffe9a8}
.tag span{background:rgba(231,191,90,.16);border:2px solid rgba(231,191,90,.55);padding:10px 30px;border-radius:40px}
.phone{position:absolute;left:50%;top:290px;width:400px;height:690px;transform-origin:top center;transform:translateX(-50%) scale(2.02);border-radius:34px;overflow:hidden;border:7px solid #d8b25a;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 2px #6b4f1a;background:#fff}
.phone iframe{width:100%;height:100%;border:0;display:block}
.cap{position:absolute;left:60px;right:60px;bottom:96px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 50px/1.25 Poppins;color:#1a1208;background:linear-gradient(180deg,#ffe9a8,#e7bf5a);border-radius:34px;padding:22px 36px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.full{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center;background:radial-gradient(120% 80% at 50% 30%,#3a2a12 0%,#1a1208 60%,#0d0904 100%)}
.full img{width:300px;height:300px;border-radius:70px;box-shadow:0 20px 70px rgba(231,191,90,.35)}
.full h1{font:800 92px/1.08 'Playfair Display',serif;background:linear-gradient(180deg,#ffe9a8,#e7bf5a 55%,#b8862a);-webkit-background-clip:text;color:transparent;padding:0 60px}
.full p{font:600 46px/1.35 Poppins;color:#f6e7c1;padding:0 90px}
.full .btn{font:800 60px Poppins;color:#1a1208;background:linear-gradient(180deg,#ffe9a8,#e7bf5a);padding:26px 60px;border-radius:60px;box-shadow:0 14px 50px rgba(231,191,90,.45)}
.full small{font:500 34px Poppins;color:#cdb98a}
body.intro #intro,body.outro #outro{display:flex}
</style></head><body>
<div class="glow"></div>
<div class="hd"><img src="/__v/logo.png" alt=""><b>MyGoldRates</b></div>
<div class="tag"><span>✨ Ask Sona · Best offer today</span></div>
<div class="phone"><iframe id="ph" src="/?v=1"></iframe></div>
<div class="cap" id="cap"></div>
<div class="full" id="intro"><img src="/__v/logo.png" alt=""><h1>Which jeweller is cheapest after offers?</h1><p>Sona works it out for you — making charges, today's offers, GST.</p></div>
<div class="full" id="outro"><img src="/__v/logo.png" alt=""><h1>Ask Sona, free</h1><p>Today's rates, making charges &amp; offers from 36 jewellers · 13 languages</p><div class="btn">Visit now: mygoldrates.com</div><small>No app needed</small></div>
<script>
window.setScene=function(s,cap){document.body.className=s||'';document.getElementById('cap').innerHTML=cap||'';document.getElementById('cap').style.visibility=cap?'visible':'hidden';};
</script></body></html>
