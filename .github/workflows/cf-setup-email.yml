name: cf-setup-email

on:
  workflow_dispatch:
    inputs:
      destination_email:
        description: "Your personal email address to receive contact@mygoldrates.com emails"
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Cloudflare Email Routing via API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEST: ${{ inputs.destination_email }}
        run: |
          set -e
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")

          echo "=== 1. Token Audit ==="
          curl -s "${auth[@]}" "$api/user/tokens/verify" | jq .

          echo "=== 2. List Account Zones ==="
          zones=$(curl -s "${auth[@]}" "$api/zones?account.id=$CF_ACCT")
          echo "$zones" | jq '{success, result: [.result[] | {id:.id, name:.name, status:.status}]}'

          zid=$(echo "$zones" | jq -r '.result[] | select(.name=="mygoldrates.com") | .id // empty')
          if [ -z "$zid" ]; then
            zid=$(echo "$zones" | jq -r '.result[0].id // empty')
          fi

          echo "Found Zone ID: ${zid:-<none>}"

          if [ -z "$zid" ]; then
            echo "Searching all accessible zones..."
            all_zones=$(curl -s "${auth[@]}" "$api/zones")
            echo "$all_zones" | jq '{success, result: [.result[]? | {id:.id, name:.name}]}'
            zid=$(echo "$all_zones" | jq -r '.result[]? | select(.name=="mygoldrates.com") | .id // empty')
          fi

          if [ -z "$zid" ]; then
            echo "Error: Zone ID for mygoldrates.com could not be retrieved with current API token permissions."
            exit 1
          fi

          echo "=== 3. Enable Email Routing on Zone $zid ==="
          curl -s "${auth[@]}" -X POST "$api/zones/$zid/email/routing/enable" | jq .

          echo "=== 4. Add Destination Address ($DEST) ==="
          curl -s "${auth[@]}" -X POST "$api/accounts/$CF_ACCT/email/routing/addresses" \
            -d "{\"email\":\"$DEST\"}" | jq .

          echo "=== 5. Create Forwarding Rule for contact@mygoldrates.com ==="
          curl -s "${auth[@]}" -X POST "$api/zones/$zid/email/routing/rules" \
            -d "{\"actions\":[{\"type\":\"forward\",\"value\":[\"$DEST\"]}],\"matchers\":[{\"field\":\"to\",\"type\":\"literal\",\"value\":\"contact@mygoldrates.com\"}],\"name\":\"Forward contact@mygoldrates.com\",\"enabled\":true}" \
            | jq .

          echo "=== 6. Auto-Add MX & TXT SPF DNS Records ==="
          curl -s "${auth[@]}" -X POST "$api/zones/$zid/email/routing/dns" \
            -d '{"type":"enable"}' | jq .
