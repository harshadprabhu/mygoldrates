name: charges
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1,16 * *"   # ~every 15 days (1st & 16th), ~09:47 IST

permissions:
  contents: write

jobs:
  charges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scrape_charges.py
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
      - name: Commit making-charges.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/making-charges.json
          if git diff --cached --quiet; then
            echo "unchanged"
          else
            git commit -m "charges: refresh making-charges.json"
            git fetch origin main
            git rebase -X ours origin/main || {
              git rebase --abort
              git reset --soft origin/main
              git add docs/making-charges.json
              git commit -m "charges: refresh making-charges.json"
            }
            git push
          fi
