name: charges
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "true = only survey which jewellers show a making charge in their product pages (changes nothing)"
        default: "false"
  schedule:
    - cron: "17 4 1,16 * *"   # ~every 15 days (1st & 16th), ~09:47 IST

permissions:
  contents: write

jobs:
  charges:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests supabase
      - name: Survey (probe mode)
        if: inputs.probe == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python charges_probe.py
      - name: Browser for jewellers whose breakup only shows in a browser (Malabar)
        if: inputs.probe != 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect making charges
        if: inputs.probe != 'true'
        run: python collect_charges.py
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
      # the collection rewrites the file: put the jewellers' own figures back in
      - name: Merge the jewellers' own making charges
        if: inputs.probe != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python jeweller_making.py
      - name: Commit making-charges.json
        if: inputs.probe != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/making-charges.json data/jeweller_making.json
          if git diff --cached --quiet; then
            echo "unchanged"
          else
            git commit -m "charges: refresh making-charges.json"
            git fetch origin main
            git rebase -X ours origin/main || {
              git rebase --abort
              git reset --soft origin/main
              git add docs/making-charges.json data/jeweller_making.json
              git commit -m "charges: refresh making-charges.json"
            }
            git push
          fi
