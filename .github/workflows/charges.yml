name: charges
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "true = only survey which jewellers show a making charge in their product pages; tanishq = read a few Tanishq products through the proxies; price = a few from price_making.py (these change nothing); migrate = move the old git data into Supabase"
        default: "false"
  schedule:
    - cron: "17 4 1,16 * *"   # ~every 15 days (1st & 16th), ~09:47 IST

permissions:
  contents: read

jobs:
  charges:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests supabase
      - name: Survey (probe mode)
        if: inputs.probe == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python charges_probe.py
      - name: Tanishq survey (probe=tanishq)
        if: inputs.probe == 'tanishq'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python tanishq_charges.py
      - name: One-off move of the old git data into Supabase (probe=migrate)
        if: inputs.probe == 'migrate'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python private_store.py migrate
          python private_store.py push-making
          python private_store.py push-offers
      - name: Survey of the readers in price_making.py (probe=price)
        if: inputs.probe == 'price'
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
        run: python price_making.py
      - name: Browser for jewellers whose breakup only shows in a browser (Malabar)
        if: inputs.probe != 'true' && inputs.probe != 'tanishq' && inputs.probe != 'price' && inputs.probe != 'migrate'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect making charges
        if: inputs.probe != 'true' && inputs.probe != 'tanishq' && inputs.probe != 'price' && inputs.probe != 'migrate'
        run: python collect_charges.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          # Tanishq answers only through the proxies (tanishq_charges.py)
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
      # the collection rewrites the file: put the jewellers' own figures back in
      - name: Merge the jewellers' own making charges
        if: inputs.probe != 'true' && inputs.probe != 'tanishq' && inputs.probe != 'price' && inputs.probe != 'migrate'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python jeweller_making.py
      # the data is private: saved to Supabase (private_store.py), never to git
      - name: Confirm the run is saved in Supabase
        if: inputs.probe != 'true' && inputs.probe != 'tanishq' && inputs.probe != 'price' && inputs.probe != 'migrate'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python private_store.py push-making
