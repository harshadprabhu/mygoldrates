name: deploy-preview

# Builds the site and deploys it to a Cloudflare Pages PREVIEW URL (not the
# production site) on every push to the dev branch, so a change can be tried
# at https://dev-preview.mygoldrates.pages.dev before it goes to main. It
# never commits anything and never touches the production (main) deployment.
# AdSense is intentionally left out of the preview build (no ad units render
# on the preview domain). Google sign-in may not complete on the preview
# origin (it is not in the OAuth client's authorised origins) - test the
# mobile-number step via the email path, which hits the same "done" step.

on:
  push:
    branches: ["claude/finmetpulse-realtime-analysis-45g61l"]

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt || { sleep 20; pip install -r requirements.txt; }
      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: python generate_site.py
      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name=mygoldrates \
            --branch=dev-preview \
            --commit-dirty=true
