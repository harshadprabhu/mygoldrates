name: analytics-audit

# Read-only: checks the private dashboard's numbers against the raw tables
# (analytics_audit.py). Forwarded as job annotations, never committed -
# this repository is public.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: python analytics_audit.py > report.txt 2>&1 || true
      - name: Forward report as annotations
        run: |
          python - <<'PY'
          t = open("report.txt", encoding="utf-8", errors="replace").read()
          chunks = [t[i:i+3500] for i in range(0, len(t), 3500)][:10]
          for n, c in enumerate(chunks, 1):
              enc = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=audit part {n} of {len(chunks)}::{enc}")
          PY
