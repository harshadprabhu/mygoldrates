name: fetch-rates

on:
  schedule:
    # Adaptive-ish window, all times UTC. IST = UTC+5:30.
    # Morning discovery sweep: 09:00-11:30 IST, every 30 min.
    - cron: "30 3,4,5,6 * * *"
    # Afternoon revision checks: 14:00 and 17:00 IST.
    - cron: "30 8,11 * * *"
    # Late retry for anything still missing.
    - cron: "30 14 * * *"
  workflow_dispatch:        # lets you trigger a run by hand if you ever want to

concurrency:
  group: fetch-rates
  cancel-in-progress: false

permissions:
  contents: write   # the job commits the regenerated site in docs/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python scrape.py

      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python generate_site.py

      - name: Publish site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "site unchanged"
          else
            git commit -m "Update site rates"
            git pull --rebase origin main
            git push
          fi
