name: fetch-rates

on:
  schedule:
    # Every 30 minutes. Collection volume is no longer the constraint, so the
    # board tracks intraday revisions continuously instead of catching six
    # fixed windows - a jeweller who revises at 12:40 IST now shows within
    # the half hour rather than waiting for the old 14:47 slot.
    #
    # Offset to :07/:37 rather than :00/:30 deliberately: GitHub delays
    # scheduled runs on private repos and the on-the-hour and on-the-half
    # minutes are the most congested, so odd minutes get picked up sooner.
    # A dropped tick is harmless - the next is 30 minutes out and every run
    # re-runs all brands from scratch, so nothing accumulates.
    #
    # `concurrency` below (group without cancel-in-progress) already keeps
    # two runs from overlapping if one is slow.
    - cron: "7,37 * * * *"
  workflow_dispatch:        # manual runs + the Cloudflare Worker cron
    inputs:
      alerts:
        description: "Send the daily digest from this run (true/false)"
        type: string
        default: "false"

concurrency:
  group: fetch-rates
  cancel-in-progress: false

permissions:
  contents: write   # the job commits the regenerated site in docs/

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || { sleep 30; pip install -r requirements.txt; }
          # The browser must never stop the run (11 Nov 2026: GitHub's runners could
          # not reach Ubuntu's package servers for over an hour; each attempt at
          # --with-deps took ~10 min and the job hit its time limit). The runner
          # already has Chrome's libraries, so: Chromium alone (from Playwright's
          # own servers), and Ubuntu's packages only if it will not start - each
          # capped at 5 minutes. Pages that need a browser skip a run without one.
          timeout 300 playwright install chromium || echo "browser download failed"
          if ! timeout 60 python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            timeout 300 playwright install-deps chromium \
              || echo "::warning title=Browser not ready::pages that need a browser are skipped this run"
          fi

      - name: Fetch rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
        run: python collect.py

      # Reports brands whose configured rate_url has gone dead and are
      # publishing off path discovery instead. Never fails the run - a
      # stale pin must be visible, not blocking. See pin_health.py.
      - name: Pin health
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python pin_health.py

      # Once a day (the morning run that sends the digest): coin making
      # charges worked out from coin prices and our 24K rates, recorded by
      # day so they can be watched (coin_price_making.py). Never blocks.
      - name: Coin making from coin prices (daily)
        if: ${{ !cancelled() && github.event.inputs.alerts == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python coin_price_making.py

      # Manubhai's making charges by category, from the readings the JD
      # Worker takes of its product pages (manubhai_making.py). Every run:
      # it only reads the cache, and the readings fill in through the day.
      - name: Manubhai making from product prices
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python manubhai_making.py

      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: python generate_site.py

      - name: Publish site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "site unchanged"
          else
            git commit -m "Update site rates"
            # Fetch latest remote state
            git fetch origin main
            # Rebase onto latest main; on conflict, accept our (CI-generated) version
            # in a rebase, "theirs" is the commit being replayed = this fresh build
            # ("ours" kept the OLDER files from main on any conflict - 3 Nov 2026)
            git rebase -X theirs origin/main || {
              git rebase --abort
              # Fallback: hard reset to origin/main and re-apply our docs
              git reset --soft origin/main
              git add docs
              git commit -m "Update site rates"
            }
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create mygoldrates \
            --production-branch=main || echo "project exists, continuing"
          npx --yes wrangler@3 pages deploy docs \
            --project-name=mygoldrates \
            --branch=main \
            --commit-dirty=true

      - name: Send daily alert emails
        # Fire ONLY on an explicit alerts=true dispatch (the Cloudflare
        # Worker's precisely-timed 11:00 IST cron, or a manual run with the
        # alerts input set) - and even if an earlier step failed.
        #
        # This used to ALSO fire on any of the 4 native GitHub "morning
        # window" schedule crons below, regardless of what was actually
        # requested - a redundancy built for when this repo was private,
        # since GitHub delays private-repo scheduled workflows by 30-120+
        # minutes and multiple staggered attempts were needed as a catch-up.
        # Now that the repo is public, GitHub's native scheduler runs far
        # more reliably, so several of those 4 crons started actually firing
        # close to on-time on the same morning - and since the condition
        # didn't care WHICH one fired first, the daily email started going
        # out at whichever of 07:33/08:53/10:13/11:33 IST happened to
        # complete first that day, instead of predictably at 11:00. Tying
        # this to the Worker's explicit signal alone restores that.
        if: >
          !cancelled() && github.event.inputs.alerts == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
        run: python send_alerts.py

      # The morning gold rate as a phone/browser notification to everyone who
      # turned it on (push_send.py), same morning signal as the email.
      - name: Send morning notifications
        if: >
          !cancelled() && github.event.inputs.alerts == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python push_send.py
