name: fetch-rates

on:
  schedule:
    # Three runs a day, all times UTC (IST = UTC+5:30).
    # 05:35 UTC = 11:05 IST - alerts are emailed from this run (~11:10 IST).
    - cron: "35 5 * * *"
    # 08:30 UTC = 14:00 IST.
    - cron: "30 8 * * *"
    # 11:30 UTC = 17:00 IST.
    - cron: "30 11 * * *"
  workflow_dispatch:        # lets you trigger a run by hand if you ever want to

concurrency:
  group: fetch-rates
  cancel-in-progress: false

permissions:
  contents: write   # the job commits the regenerated site in docs/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python scrape.py

      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: python generate_site.py

      - name: Publish site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "site unchanged"
          else
            git commit -m "Update site rates"
            git pull --rebase origin main
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create mygoldrates \
            --production-branch=main || echo "project exists, continuing"
          npx --yes wrangler@3 pages deploy docs \
            --project-name=mygoldrates \
            --branch=main \
            --commit-dirty=true

      - name: Send daily alert emails
        # Runs on every scheduled run (11:05/14:00/17:00 IST) and manual runs,
        # and even if an earlier step failed, so a missed or failed 11:05 send
        # is retried the same day. send_alerts.py's per-subscriber last_emailed
        # guard (set only on a successful send) keeps it to one email a day and
        # makes the later runs retry only whoever hasn't received it yet.
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
        run: python send_alerts.py
