name: fetch-rates

on:
  schedule:
    # GitHub delays scheduled runs on private repos (often 30-120+ min) and
    # :00/:30 are the most congested minutes - so we use odd minutes and
    # schedule the MORNING runs early with several attempts, so fresh rates
    # are up well before ~11 IST even after a delay. Times UTC (IST=UTC+5:30).
    - cron: "3 2 * * *"     # 07:33 IST  (morning window)
    - cron: "23 3 * * *"    # 08:53 IST
    - cron: "43 4 * * *"    # 10:13 IST
    - cron: "3 6 * * *"     # 11:33 IST  (catch-up if earlier ones were dropped)
    - cron: "17 9 * * *"    # 14:47 IST  (afternoon revision)
    - cron: "41 11 * * *"   # 17:11 IST  (late revision)
  workflow_dispatch:        # manual runs + the Cloudflare Worker cron
    inputs:
      alerts:
        description: "Send the daily digest from this run (true/false)"
        type: string
        default: "false"

concurrency:
  group: fetch-rates
  cancel-in-progress: false

permissions:
  contents: write   # the job commits the regenerated site in docs/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
        run: python scrape.py

      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: python generate_site.py

      - name: Publish site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "site unchanged"
          else
            git commit -m "Update site rates"
            # Fetch latest remote state
            git fetch origin main
            # Rebase onto latest main; on conflict, accept our (CI-generated) version
            git rebase -X ours origin/main || {
              git rebase --abort
              # Fallback: hard reset to origin/main and re-apply our docs
              git reset --soft origin/main
              git add docs
              git commit -m "Update site rates"
            }
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create mygoldrates \
            --production-branch=main || echo "project exists, continuing"
          npx --yes wrangler@3 pages deploy docs \
            --project-name=mygoldrates \
            --branch=main \
            --commit-dirty=true

      - name: Send daily alert emails
        # Fire ONLY on an explicit alerts=true dispatch (the Cloudflare
        # Worker's precisely-timed 11:00 IST cron, or a manual run with the
        # alerts input set) - and even if an earlier step failed.
        #
        # This used to ALSO fire on any of the 4 native GitHub "morning
        # window" schedule crons below, regardless of what was actually
        # requested - a redundancy built for when this repo was private,
        # since GitHub delays private-repo scheduled workflows by 30-120+
        # minutes and multiple staggered attempts were needed as a catch-up.
        # Now that the repo is public, GitHub's native scheduler runs far
        # more reliably, so several of those 4 crons started actually firing
        # close to on-time on the same morning - and since the condition
        # didn't care WHICH one fired first, the daily email started going
        # out at whichever of 07:33/08:53/10:13/11:33 IST happened to
        # complete first that day, instead of predictably at 11:00. Tying
        # this to the Worker's explicit signal alone restores that.
        if: >
          !cancelled() && github.event.inputs.alerts == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
        run: python send_alerts.py
