name: fetch-rates

on:
  schedule:
    # GitHub delays scheduled runs on private repos (often 30-120+ min) and
    # :00/:30 are the most congested minutes - so we use odd minutes and
    # schedule the MORNING runs early with several attempts, so fresh rates
    # are up well before ~11 IST even after a delay. Times UTC (IST=UTC+5:30).
    - cron: "3 2 * * *"     # 07:33 IST  (morning window)
    - cron: "23 3 * * *"    # 08:53 IST
    - cron: "43 4 * * *"    # 10:13 IST
    - cron: "3 6 * * *"     # 11:33 IST  (catch-up if earlier ones were dropped)
    - cron: "17 9 * * *"    # 14:47 IST  (afternoon revision)
    - cron: "41 11 * * *"   # 17:11 IST  (late revision)
  workflow_dispatch:        # manual runs + the Cloudflare Worker cron
    inputs:
      alerts:
        description: "Send the daily digest from this run (true/false)"
        type: string
        default: "false"

concurrency:
  group: fetch-rates
  cancel-in-progress: false

permissions:
  contents: write   # the job commits the regenerated site in docs/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          WEBSCRAPINGAPI_KEY: ${{ secrets.WEBSCRAPINGAPI_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
        run: python scrape.py

      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: python generate_site.py

      - name: Publish site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "site unchanged"
          else
            git commit -m "Update site rates"
            git pull --rebase origin main
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create mygoldrates \
            --production-branch=main || echo "project exists, continuing"
          npx --yes wrangler@3 pages deploy docs \
            --project-name=mygoldrates \
            --branch=main \
            --commit-dirty=true

      - name: Send daily alert emails
        # Fire on the morning-window crons; send_alerts.py's per-subscriber
        # last_emailed guard ensures at most ONE email per day, so whichever
        # morning run lands first sends it and the rest are no-ops. (Excludes
        # the afternoon crons so a delayed day still emails in the morning.)
        if: >
          github.event.inputs.alerts == 'true' ||
          github.event.schedule == '3 2 * * *' ||
          github.event.schedule == '23 3 * * *' ||
          github.event.schedule == '43 4 * * *' ||
          github.event.schedule == '3 6 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
        run: python send_alerts.py
