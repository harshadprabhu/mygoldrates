name: news-post

# One Instagram post a day: today's gold news in our own words (news_post.py),
# from publishers' RSS feeds, summarised by Gemini's free text model and
# checked (every number must be in the news; the market view attributed).
# Nothing passes the checks: nothing is posted that day.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC ~ 08:47 IST, before the 11:17 rate card
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (build the card only) or post"
        default: "preview"

permissions:
  contents: write

concurrency:
  group: social-post        # never at the same moment as the rate card

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests supabase

      - name: Build the news card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_post.py build

      - name: Publish the card to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/social
          git commit -m "Instagram news card $(TZ=Asia/Kolkata date +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Post to Instagram
        if: github.event_name == 'schedule' || inputs.mode == 'post'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          D=$(TZ=Asia/Kolkata date +%F)
          [ -f "docs/social/news-$D.jpg" ] || { echo "no news card today"; exit 0; }
          git fetch -q origin main && SHA=$(git rev-parse origin/main)
          python news_post.py publish "https://raw.githubusercontent.com/${{ github.repository }}/$SHA/docs/social/news-$D.jpg"
          git add docs/social/posted.json 2>/dev/null || true
          git commit -m "Instagram news posted $D" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
