name: mcx-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Probe MCX DOM via Zyte
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python mcx_probe.py
