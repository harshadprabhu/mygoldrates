name: cf-email-routing

on:
  workflow_dispatch:
    inputs:
      destination_email:
        description: "Destination email to forward contact@mygoldrates.com to (optional)"
        required: false
        default: ""

jobs:
  email_routing:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and Configure Cloudflare Email Routing for contact@mygoldrates.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEST_EMAIL: ${{ inputs.destination_email }}
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")

          echo "=== 1. Verify Cloudflare Token ==="
          curl -s "${auth[@]}" "$api/user/tokens/verify" | jq '{success, status:.result.status}'

          echo "=== 2. Zone Lookup for mygoldrates.com ==="
          zid=$(curl -s "${auth[@]}" "$api/zones?name=mygoldrates.com" | jq -r '.result[0].id // empty')
          echo "zone_id=${zid:-<none>}"
          if [ -z "$zid" ]; then
            echo "!! Unable to find zone_id for mygoldrates.com"
            exit 1
          fi

          echo "=== 3. Current Email Routing Settings ==="
          curl -s "${auth[@]}" "$api/zones/$zid/email/routing" | jq '{success, result}'

          echo "=== 4. Current Email Routing Rules ==="
          curl -s "${auth[@]}" "$api/zones/$zid/email/routing/rules" | jq '{success, result:.result}'

          echo "=== 5. Account Destination Addresses ==="
          curl -s "${auth[@]}" "$api/accounts/$CF_ACCT/email/routing/addresses" | jq '{success, result:.result}'

          echo "=== 6. Enable Email Routing & Auto-Configure DNS Records ==="
          curl -s "${auth[@]}" -X POST "$api/zones/$zid/email/routing/enable" | jq '{success, result}'

          if [ -n "$DEST_EMAIL" ]; then
            echo "=== 7. Adding Destination Address: $DEST_EMAIL ==="
            curl -s "${auth[@]}" -X POST "$api/accounts/$CF_ACCT/email/routing/addresses" \
              -d "{\"email\":\"$DEST_EMAIL\"}" | jq '{success, result}'

            echo "=== 8. Creating Routing Rule for contact@mygoldrates.com ==="
            curl -s "${auth[@]}" -X POST "$api/zones/$zid/email/routing/rules" \
              -d "{\"actions\":[{\"type\":\"forward\",\"value\":[\"$DEST_EMAIL\"]}],\"matchers\":[{\"field\":\"to\",\"type\":\"literal\",\"value\":\"contact@mygoldrates.com\"}],\"name\":\"Forward contact@mygoldrates.com\",\"enabled\":true}" \
              | jq '{success, result}'
          fi
