name: jd-report

# Builds the subscriber workbook and uploads it to the PRIVATE Supabase
# Storage bucket. Daily, after the morning collects have landed.
#
# The workbook is NOT committed. Everything under docs/ is published to
# mygoldrates.com, so committing the paid artifact would give it away; it
# goes to private storage and subscribers get short-lived signed URLs from
# the JD worker.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"   # 06:45 UTC ~ 12:15 IST, after the morning runs

permissions:
  contents: read

concurrency:
  group: jd-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Market outlook
        # The in-depth analysis is a Jewellers Digest deliverable, not public
        # copy, so it runs here rather than in the site build. It writes to a
        # build-local path that is never published.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python outlook.py

      - name: Build and upload the subscriber workbook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Without it the workbook is built and uploaded exactly as
          # before, minus the written note - the sheet then says the note was
          # withheld rather than silently vanishing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python jd_report.py
