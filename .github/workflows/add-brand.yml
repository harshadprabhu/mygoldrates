name: add-brand
on:
  workflow_dispatch:
    inputs:
      brand_json:
        description: "Brand row as JSON"
        required: true

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install supabase
      - name: Add brand
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRAND_JSON: ${{ inputs.brand_json }}
        run: python add_brand.py
