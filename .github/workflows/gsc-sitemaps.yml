name: gsc-sitemaps

# List the sitemaps registered in Search Console, or clean them up: remove
# any entry that is not one of the site's own sitemaps and resubmit
# sitemap.xml. Results come back as job annotations (this repo is public).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list (read-only), submit (register all sitemaps) or cleanup"
        default: "list"
  # Weekly: keep all five sitemaps registered and ask Google to re-read
  # them (on 2026-10-20 it had not read sitemap.xml since 26 September).
  schedule:
    - cron: "17 3 * * 1"   # Mondays ~08:47 IST

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth google-api-python-client
      - name: Run
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python gsc_sitemaps.py "${{ inputs.mode || 'submit' }}" > out.txt 2>&1 || true
      - name: Report
        run: |
          python - <<'PY'
          t = open("out.txt", encoding="utf-8", errors="replace").read()
          for n, c in enumerate([t[i:i+3500] for i in range(0, len(t), 3500)][:5], 1):
              print("::notice title=gsc-sitemaps " + str(n) + "::" + c.replace("%", "%25").replace("\n", "%0A"))
          PY
