name: deploy-only

on:
  workflow_dispatch:   # manual trigger from GitHub Actions UI or CLI

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create mygoldrates \
            --production-branch=main || echo "project exists, continuing"
          npx --yes wrangler@3 pages deploy docs \
            --project-name=mygoldrates \
            --branch=main \
            --commit-dirty=true
