name: deploy-jd-worker

# Deploys the Jewellers Digest (JD) subscription API. Manual only: this
# Worker holds payment credentials and decides who has paid, so it should go
# out when someone means it to, not on every push to main.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy
        working-directory: cf-worker-jd
        env:
          # CF_WORKERS_TOKEN, not CLOUDFLARE_API_TOKEN. The latter is the
          # Pages token and cannot touch Workers scripts; wiring it here
          # made every deploy of this Worker fail with "No access to the
          # specified resource", which reads like a permissions problem
          # and is actually the wrong secret. Both working Worker deploys
          # (deploy-worker, deploy-market-worker) use CF_WORKERS_TOKEN.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
