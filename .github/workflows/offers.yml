name: offers
# Today's jeweller offers, read from each jeweller's own website with fixed
# rules (offers.py) - no paid service. Offers shown only in banner pictures
# are read with Tesseract OCR (free, banner_ocr.py). Writes docs/offers.json; the next site
# build turns it into /gold-offers-today. Also exports the answers the owner
# approved for Sona, the site assistant (bot_learn.py).
on:
  workflow_dispatch:
    inputs:
      teach_days:
        description: "How many days of Sona's unanswered questions to learn from"
        default: "2"
  schedule:
    - cron: "41 0 * * *"   # 06:11 IST, before the morning rate runs

permissions:
  contents: write

jobs:
  offers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -q tesseract-ocr
          pip install requests supabase playwright pytesseract pillow numpy
          playwright install --with-deps chromium
      - run: python offers.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Sona learns: answers for what she could not answer (bot_teach.py,
      # Gemini's free text model, checked), then every approved answer into git.
      - run: python bot_teach.py
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TEACH_DAYS: ${{ inputs.teach_days }}
      - run: python bot_learn.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Making charges the jewellers sent themselves (jeweller_making.py).
      - run: python jeweller_making.py
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit offers.json and Sona's approved answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/offers.json data/assistant_answers.json docs/making-charges.json data/jeweller_making.json
          if git diff --cached --quiet; then
            echo "unchanged"
          else
            git commit -m "offers: refresh offers.json and approved answers"
            git fetch origin main
            git rebase -X ours origin/main || {
              git rebase --abort
              git reset --soft origin/main
              git add docs/offers.json data/assistant_answers.json docs/making-charges.json data/jeweller_making.json
              git commit -m "offers: refresh offers.json and approved answers"
            }
            for i in 1 2 3; do git push -q origin HEAD:main && break; sleep 5; git pull --rebase -q origin main; done
          fi
