name: cf-security-check

# Read-only. Search Console reported "Blocked due to access forbidden
# (403)" for six pages crawled 15-18 Oct 2026, while the pages answer 200
# to ordinary requests. This finds the Cloudflare credentials stored as
# repository secrets (prints their NAMES and what each may read - never a
# value), then, with one that can, reports the zone's security settings and
# the recent requests from search crawlers that Cloudflare blocked or
# challenged, and by what. Nothing is changed. Results are job annotations.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Cloudflare
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          API = "https://api.cloudflare.com/client/v4"
          sec = json.loads(os.environ["ALL_SECRETS"])
          out = []
          def call(path, auth, body=None):
              req = urllib.request.Request(API + path, data=json.dumps(body).encode() if body else None,
                                           headers={**auth, "Content-Type": "application/json"})
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=20).read())
              except urllib.error.HTTPError as e:
                  try: return json.loads(e.read())
                  except Exception: return {"success": False, "errors": [{"message": str(e)}]}
              except Exception as e:
                  return {"success": False, "errors": [{"message": str(e)}]}
          names = [k for k in sec if any(w in k.upper() for w in ("CLOUDFLARE", "CF_", "CF"))]
          out.append("Cloudflare-related secret names: " + ", ".join(sorted(names)))
          email = next((sec[k] for k in names if "EMAIL" in k.upper()), None)
          auths = []
          for k in sorted(names):
              v = (sec[k] or "").strip()
              if not v or "EMAIL" in k.upper() or "ACCOUNT" in k.upper() and len(v) == 32 and v.isalnum() and "KEY" not in k.upper():
                  continue
              auths.append((k, {"Authorization": "Bearer " + v}))
              if email and "KEY" in k.upper():
                  auths.append((k + " (global key)", {"X-Auth-Email": email, "X-Auth-Key": v}))
          good = None
          for k, auth in auths:
              z = call("/zones?name=mygoldrates.com", auth)
              zid = (z.get("result") or [{}])[0].get("id") if z.get("success") and z.get("result") else None
              if not zid:
                  out.append(f"{k}: no zone access"); continue
              ok = {}
              for s in ("security_level", "browser_check"):
                  r = call(f"/zones/{zid}/settings/{s}", auth)
                  ok[s] = r.get("result", {}).get("value") if r.get("success") else "no access"
              bm = call(f"/zones/{zid}/bot_management", auth)
              ok["bot_management"] = bm.get("result") if bm.get("success") else "no access"
              out.append(f"{k}: zone ok | " + " | ".join(f"{a}={json.dumps(b)}" for a, b in ok.items()))
              if good is None and ok["security_level"] != "no access":
                  good = (k, auth, zid)
          if good:
              k, auth, zid = good
              out.append(f"\nUsing {k} for the event log.")
              now = datetime.datetime.utcnow()
              q = {"query": "query($z:String!,$s:Time!,$u:Time!){viewer{zones(filter:{zoneTag:$z}){firewallEventsAdaptiveGroups(limit:60,filter:{datetime_geq:$s,datetime_leq:$u},orderBy:[count_DESC]){count dimensions{action source userAgent clientRequestPath}}}}}",
                   "variables": {"z": zid, "s": (now - datetime.timedelta(days=3)).strftime("%Y-%m-%dT%H:%M:%SZ"),
                                 "u": now.strftime("%Y-%m-%dT%H:%M:%SZ")}}
              r = call("/graphql", auth, q)
              if r.get("errors"):
                  out.append("firewall events: " + json.dumps(r["errors"])[:600])
              else:
                  ev = r["data"]["viewer"]["zones"][0]["firewallEventsAdaptiveGroups"]
                  out.append(f"firewall events, last 3 days: {len(ev)} groups")
                  bots = [e for e in ev if any(b in (e["dimensions"]["userAgent"] or "") for b in ("Googlebot", "bingbot", "Google-", "GoogleOther"))]
                  out.append(f"  of which search crawlers: {len(bots)}")
                  for e in (bots or ev)[:40]:
                      d = e["dimensions"]
                      out.append(f"  {e['count']}x {d['action']} by {d['source']} {d['clientRequestPath']} UA={(d['userAgent'] or '')[:70]}")
          else:
              out.append("\nNo stored credential can read the zone's security settings.")
          t = "\n".join(out)
          for n, c in enumerate([t[i:i+3500] for i in range(0, len(t), 3500)][:6], 1):
              print("::notice title=cf-security " + str(n) + "::" + c.replace("%", "%25").replace("\n", "%0A"))
          PY
