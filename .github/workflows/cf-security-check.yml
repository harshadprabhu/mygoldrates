name: cf-security-check

# Read-only. Search Console reported "Blocked due to access forbidden
# (403)" for six pages crawled 15-18 Oct 2026, while the pages answer 200
# to ordinary requests. This asks Cloudflare which security settings are on
# and which recent requests from search crawlers were blocked or
# challenged, and by what. Nothing is changed. Results are job annotations.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Cloudflare
        env:
          ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4"
          out=/tmp/out.txt; : > $out
          for name in ZONE_TOKEN API_TOKEN; do
            tok="${!name:-}"; [ -z "$tok" ] && { echo "$name not set" >> $out; continue; }
            zid=$(curl -s -H "Authorization: Bearer $tok" "$api/zones?name=mygoldrates.com" | jq -r '.result[0].id // empty')
            [ -z "$zid" ] && { echo "$name: no zone access" >> $out; continue; }
            echo "== token $name, zone ok" >> $out
            for s in security_level browser_check challenge_ttl waf; do
              echo "setting $s: $(curl -s -H "Authorization: Bearer $tok" "$api/zones/$zid/settings/$s" | jq -c '.result.value // .errors')" >> $out
            done
            echo "bot management: $(curl -s -H "Authorization: Bearer $tok" "$api/zones/$zid/bot_management" | jq -c '.result // .errors')" >> $out
            echo "custom rules phase: $(curl -s -H "Authorization: Bearer $tok" "$api/zones/$zid/rulesets/phases/http_request_firewall_custom/entrypoint" | jq -c '[.result.rules[]? | {description, action, expression, enabled}] // .errors')" >> $out
            echo "rate limit phase: $(curl -s -H "Authorization: Bearer $tok" "$api/zones/$zid/rulesets/phases/http_ratelimit/entrypoint" | jq -c '[.result.rules[]? | {description, action, expression, enabled}] // .errors')" >> $out
            since=$(date -u -d '-3 days' +%Y-%m-%dT%H:%M:%SZ); until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            q='{"query":"query($z:String!,$s:Time!,$u:Time!){viewer{zones(filter:{zoneTag:$z}){firewallEventsAdaptiveGroups(limit:50,filter:{datetime_geq:$s,datetime_leq:$u},orderBy:[count_DESC]){count dimensions{action source userAgent clientRequestPath}}}}}","variables":{"z":"'"$zid"'","s":"'"$since"'","u":"'"$until"'"}}'
            curl -s -X POST "$api/graphql" -H "Authorization: Bearer $tok" -H "Content-Type: application/json" -d "$q" \
              | jq -r 'if (.errors|length?)>0 then "firewall events: \(.errors|tostring)"
                       else "firewall events, last 3 days (top 50):",
                         (.data.viewer.zones[0].firewallEventsAdaptiveGroups[]? | "  \(.count)x \(.dimensions.action) by \(.dimensions.source) \(.dimensions.clientRequestPath) UA=\(.dimensions.userAgent[0:70])") end' >> $out
          done
          python3 - <<'PY'
          t = open("/tmp/out.txt", encoding="utf-8", errors="replace").read()
          for n, c in enumerate([t[i:i+3500] for i in range(0, len(t), 3500)][:6], 1):
              print("::notice title=cf-security " + str(n) + "::" + c.replace("%", "%25").replace("\n", "%0A"))
          PY
