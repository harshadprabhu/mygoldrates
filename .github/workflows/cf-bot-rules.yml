name: cf-bot-rules

# Owner-approved 2026-10-20. Search Console reported 403 for six pages
# crawled 15-18 Oct while Browser Integrity Check was on. This keeps BIC on
# for everyone except crawlers Cloudflare has verified (cf.client.bot -
# checked by network, not by user agent, so a scraper claiming to be
# Googlebot is still filtered), adds a per-IP rate limit for everyone else,
# and turns Bot Fight Mode off (it cannot exempt verified bots on the free
# plan). Existing rules are never removed: a rule is added only if one with
# the same description is not already there. Results are job annotations.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apply (the rules below) or diagnose (read-only: every rule, setting and a test fetch)"
        default: "apply"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose (read-only)
        if: inputs.mode == 'diagnose'
        env:
          CF_WORKERS_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          # 6 Nov 2026: Google's URL Inspection shows the homepage refused
          # with 403 on 5 Nov. List everything at Cloudflare that can refuse
          # a request, and fetch the site as different clients.
          import json, os, urllib.request
          API = "https://api.cloudflare.com/client/v4"
          out = []
          def call(path, tok):
              req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + tok})
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=20).read())
              except urllib.error.HTTPError as e:
                  try: return json.loads(e.read())
                  except Exception: return {"success": False, "errors": [{"message": str(e)}]}
          toks = [(k, os.environ.get(k, "")) for k in ("CF_WORKERS_TOKEN", "CLOUDFLARE_ZONE_TOKEN", "CLOUDFLARE_API_TOKEN")]
          toks = [(k, v) for k, v in toks if v]
          zid = None
          for k, tok in toks:
              z = call("/zones?name=mygoldrates.com", tok)
              if z.get("success") and z.get("result"):
                  zid = z["result"][0]["id"]; out.append(f"zone plan: {z['result'][0].get('plan', {}).get('name')}"); break
          def first(path):
              for k, tok in toks:
                  r = call(path, tok)
                  if r.get("success"):
                      return r.get("result"), k
              return None, (r.get("errors") or [{}])[0].get("message", "")[:120]
          if zid:
              for s in ("security_level", "browser_check", "challenge_ttl", "bot_fight_mode", "waf",
                        "always_use_https", "ssl", "security_header", "hotlink_protection"):
                  res, k = first(f"/zones/{zid}/settings/{s}")
                  out.append(f"setting {s}: {(res or {}).get('value') if res else 'unreadable (' + str(k) + ')'}")
              res, k = first(f"/zones/{zid}/bot_management")
              out.append("bot_management: " + (json.dumps(res)[:600] if res else str(k)))
              rs, k = first(f"/zones/{zid}/rulesets")
              out.append(f"rulesets ({k}):")
              for r in rs or []:
                  out.append(f"  [{r.get('phase')}] {r.get('name')} kind={r.get('kind')} id={r.get('id')}")
                  if r.get("kind") == "zone":
                      full, _ = first(f"/zones/{zid}/rulesets/{r['id']}")
                      for rr in (full or {}).get("rules") or []:
                          out.append(f"     - {rr.get('description')} | {rr.get('action')} | enabled={rr.get('enabled')} | "
                                     f"{(rr.get('expression') or '')[:150]} | {json.dumps(rr.get('ratelimit') or rr.get('action_parameters') or {})[:200]}")
              for ph in ("http_request_firewall_custom", "http_ratelimit", "http_request_firewall_managed",
                         "http_config_settings", "http_request_sbfm", "http_request_dynamic_redirect"):
                  ep, k = first(f"/zones/{zid}/rulesets/phases/{ph}/entrypoint")
                  out.append(f"phase {ph}: " + (f"{len((ep or {}).get('rules') or [])} rules" if ep else str(k)))
                  for rr in (ep or {}).get("rules") or []:
                      out.append(f"     - {rr.get('description')} | {rr.get('action')} | enabled={rr.get('enabled')} | "
                                 f"{(rr.get('expression') or '')[:150]} | {json.dumps(rr.get('ratelimit') or rr.get('action_parameters') or {})[:200]}")
              ua, k = first(f"/zones/{zid}/firewall/ua_rules")
              out.append(f"user-agent blocking rules: {len(ua) if ua is not None else k}")
              ar, k = first(f"/zones/{zid}/firewall/access_rules/rules")
              out.append(f"IP access rules: " + (", ".join(f"{x.get('mode')}:{(x.get('configuration') or {}).get('value')}" for x in ar)[:300] if ar else str(k or 'none')))
          # what different clients get (the runner is not Google, so a
          # Googlebot user agent here is an unverified claim)
          for name, ua in (("browser", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
                           ("googlebot-ua", "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"),
                           ("bingbot-ua", "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)"),
                           ("no-ua", "")):
              for path in ("/", "/sitemap.xml", "/gold-rate-today-in-bengaluru"):
                  req = urllib.request.Request("https://mygoldrates.com" + path, headers={"User-Agent": ua} if ua else {})
                  try:
                      r = urllib.request.urlopen(req, timeout=20); st, h = r.status, r.headers
                  except urllib.error.HTTPError as e:
                      st, h = e.code, e.headers
                  except Exception as e:
                      st, h = type(e).__name__, {}
                  out.append(f"fetch {name:12s} {path:32s} -> {st} cf-mitigated={h.get('cf-mitigated') if h else None} server={h.get('server') if h else None}")
          t = "\n".join(out)
          print("::notice title=cf-diagnose::" + t.replace("%", "%25").replace("\n", "%0A"))
          PY
      - name: Apply
        if: inputs.mode != 'diagnose'
        env:
          CF_WORKERS_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          API = "https://api.cloudflare.com/client/v4"
          out = []
          def call(method, path, tok, body=None):
              req = urllib.request.Request(API + path, method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=20).read())
              except urllib.error.HTTPError as e:
                  try: return json.loads(e.read())
                  except Exception: return {"success": False, "errors": [{"message": str(e)}]}
          def err(r):
              return "; ".join(e.get("message", "") for e in r.get("errors") or [])[:300]
          toks = [(k, os.environ.get(k, "")) for k in ("CF_WORKERS_TOKEN", "CLOUDFLARE_ZONE_TOKEN", "CLOUDFLARE_API_TOKEN")]
          toks = [(k, v) for k, v in toks if v]

          RULES = {
            "http_config_settings": {
              "description": "Let search engines through (BIC off for verified bots)",
              "expression": "(cf.client.bot)",
              "action": "set_config",
              "action_parameters": {"bic": False},
              "enabled": True},
            "http_ratelimit": {
              "description": "Rate limit fast downloads (not verified bots)",
              "expression": '(http.host eq "mygoldrates.com" and not cf.client.bot)',
              "action": "block",
              "ratelimit": {"characteristics": ["cf.colo.id", "ip.src"], "period": 10,
                            "requests_per_period": 60, "mitigation_timeout": 10},
              "enabled": True},
          }
          FALLBACK_RL = '(http.host eq "mygoldrates.com")'

          def add_rule(zid, phase, rule):
              for k, tok in toks:
                  ep = call("GET", f"/zones/{zid}/rulesets/phases/{phase}/entrypoint", tok)
                  if ep.get("success"):
                      rules = ep["result"].get("rules") or []
                      if any(r.get("description") == rule["description"] for r in rules):
                          return f"{phase}: already present (seen with {k})"
                      r = call("POST", f"/zones/{zid}/rulesets/{ep['result']['id']}/rules", tok, rule)
                  else:
                      # no entrypoint yet (404) or no permission: try creating it
                      r = call("PUT", f"/zones/{zid}/rulesets/phases/{phase}/entrypoint", tok, {"rules": [rule]})
                  if r.get("success"):
                      return f"{phase}: ADDED with {k}"
                  last = f"{phase} with {k}: {err(r)}"
                  out.append("  tried " + last)
              return f"{phase}: NOT added"

          zid = None
          for k, tok in toks:
              z = call("GET", "/zones?name=mygoldrates.com", tok)
              if z.get("success") and z.get("result"):
                  zid = z["result"][0]["id"]; break
          if not zid:
              out.append("no token can see the zone")
          else:
              out.append(add_rule(zid, "http_config_settings", RULES["http_config_settings"]))
              res = add_rule(zid, "http_ratelimit", RULES["http_ratelimit"])
              if "NOT" in res:
                  rl = dict(RULES["http_ratelimit"], expression=FALLBACK_RL,
                            description="Rate limit fast downloads")
                  res = add_rule(zid, "http_ratelimit", rl) + " (without the verified-bot exception)"
              out.append(res)
              done = False
              for k, tok in toks:
                  r = call("PUT", f"/zones/{zid}/bot_management", tok, {"fight_mode": False})
                  if r.get("success"):
                      out.append(f"Bot Fight Mode: OFF (with {k}) -> {json.dumps(r['result'])[:200]}")
                      done = True; break
                  out.append(f"  Bot Fight Mode with {k}: {err(r)}")
              if not done:
                  out.append("Bot Fight Mode: NOT changed")
              # AI assistants' crawlers (owner-approved 2026-11-01): Cloudflare
              # was answering PerplexityBot with 403. Turn its "block AI bots"
              # off, and list any custom rule that names an AI crawler.
              for k, tok in toks:
                  # also the live fetchers an assistant uses to read a page
                  # while answering (ai_user), AI search crawlers and agents
                  cur = (call("GET", f"/zones/{zid}/bot_management", tok).get("result") or {})
                  # read-and-cite yes, training no (owner, 1 Nov 2026). But
                  # Cloudflare files Googlebot and Bingbot as "search + training"
                  # crawlers, so ai_training "block" refused them too: Google's
                  # URL Inspection showed the homepage 403 on 5 Nov, sitemaps
                  # unread since early October. Training is refused in
                  # robots.txt instead (GPTBot, CCBot, Google-Extended, ... and
                  # Content-Signal ai-train=no), which leaves search alone.
                  body = {"ai_bots_protection": "disabled", "ai_search": "disabled", "ai_user": "disabled",
                          "ai_training": "disabled"}
                  if isinstance(cur.get("ai_agents"), dict):
                      body["ai_agents"] = {a: "disabled" for a in cur["ai_agents"]}
                  r = call("PUT", f"/zones/{zid}/bot_management", tok, body)
                  if not r.get("success") and "ai_agents" in body:      # agents may take another value
                      out.append(f"  AI agents 'disabled' refused ({err(r)}); trying 'allow'")
                      body["ai_agents"] = {a: "allow" for a in cur["ai_agents"]}
                      r = call("PUT", f"/zones/{zid}/bot_management", tok, body)
                  if r.get("success"):
                      out.append(f"AI search crawlers, live fetchers and agents: allowed; AI training: not blocked at Cloudflare (robots.txt refuses it) (with {k})"); break
                  out.append(f"  AI settings with {k}: {err(r)}")
              for k, tok in toks:
                  r = call("GET", f"/zones/{zid}/bot_management", tok)
                  if r.get("success"):
                      out.append("bot_management now: " + json.dumps(r["result"])[:400]); break
              for k, tok in toks:
                  ep = call("GET", f"/zones/{zid}/rulesets/phases/http_request_firewall_custom/entrypoint", tok)
                  if ep.get("success"):
                      for rr in ep["result"].get("rules") or []:
                          ex = (rr.get("expression") or "").lower()
                          if any(w in ex for w in ("perplexity", "gptbot", "claudebot", "bytespider", "ai_bot", "verified_bot_category", "user_agent")):
                              out.append(f"custom rule: {rr.get('description')} | {rr.get('action')} | "
                                         f"enabled={rr.get('enabled')} | {rr.get('expression')[:160]}")
                      break
                  out.append(f"  custom rules with {k}: {err(ep)}")
              # Read-only: the addresses crawlers got 404 for in the last day
              # (Bing reports a rising "4xx" count but not which pages).
              import datetime as _dt
              since = (_dt.datetime.utcnow() - _dt.timedelta(hours=23)).strftime("%Y-%m-%dT%H:%M:%SZ")
              gq = {"query": """query($z:String!,$s:Time!){viewer{zones(filter:{zoneTag:$z}){
                     httpRequestsAdaptiveGroups(limit:60, orderBy:[count_DESC],
                       filter:{datetime_gt:$s, edgeResponseStatus_geq:400, edgeResponseStatus_lt:500}){
                       count dimensions{clientRequestPath edgeResponseStatus userAgent}}}}}""",
                    "variables": {"z": zid, "s": since}}
              for k, tok in toks:
                  r = call("POST", "/graphql", tok, gq)
                  rows = (((r.get("data") or {}).get("viewer") or {}).get("zones") or [{}])[0].get("httpRequestsAdaptiveGroups") if r.get("data") else None
                  if rows is not None:
                      import re as _re
                      agg = {}
                      for x in rows:
                          d = x["dimensions"]; ua = d.get("userAgent") or ""
                          who = next((b for b in ("bingbot", "Googlebot", "GPTBot", "OAI-SearchBot", "ClaudeBot",
                                                  "PerplexityBot", "Applebot", "YandexBot") if b.lower() in ua.lower()), "other")
                          key = (d["clientRequestPath"], d["edgeResponseStatus"], who)
                          agg[key] = agg.get(key, 0) + x["count"]
                      out.append(f"4xx in the last 23h (with {k}), most frequent first:")
                      for (pth, st, who), n in sorted(agg.items(), key=lambda kv: -kv[1])[:45]:
                          out.append(f"  {n:4d}  {st}  {who:13s} {pth}")
                      break
                  out.append(f"  4xx list with {k}: {(r.get('errors') or [{}])[0].get('message', '')[:160]}")
              s = call("GET", f"/zones/{zid}/settings/browser_check", toks[0][1])
              out.append("Browser Integrity Check (site-wide) now: " + str((s.get("result") or {}).get("value", "unknown")))
              # Email (owner, 3 Nov 2026: the daily mail lands in junk). Brevo
              # sends our mail but the SPF record named only Cloudflare Email
              # Routing. Add Brevo's include to the ONE existing SPF record,
              # keeping everything already in it; nothing else in DNS changes.
              BREVO_SPF = "include:spf.brevo.com"
              spf_done = False
              for k, tok in toks:
                  r = call("GET", f"/zones/{zid}/dns_records?type=TXT&name=mygoldrates.com", tok)
                  if not r.get("success"):
                      out.append(f"  SPF read with {k}: {err(r)}"); continue
                  spf = [x for x in r["result"] if x.get("content", "").strip('"').startswith("v=spf1")]
                  if len(spf) != 1:
                      out.append(f"SPF: found {len(spf)} SPF records - not touched"); spf_done = True; break
                  rec = spf[0]; cur = rec["content"].strip('"')
                  if BREVO_SPF in cur:
                      out.append(f"SPF: already includes Brevo: {cur}"); spf_done = True; break
                  parts = cur.split()
                  new = " ".join(parts[:-1] + [BREVO_SPF, parts[-1]]) if parts[-1].endswith("all") else cur + " " + BREVO_SPF
                  u = call("PATCH", f"/zones/{zid}/dns_records/{rec['id']}", tok, {"content": '"' + new + '"'})
                  if u.get("success"):
                      out.append(f"SPF: {cur}  ->  {new} (with {k})"); spf_done = True; break
                  out.append(f"  SPF update with {k}: {err(u)}")
              if not spf_done:
                  out.append("SPF: NOT changed (no token may edit DNS)")
          t = "\n".join(out)
          print("::notice title=cf-bot-rules::" + t.replace("%", "%25").replace("\n", "%0A"))
          PY
