name: traffic-sources

# Read-only: where visitors come from, day by day (traffic_sources.py).
# Forwarded as job annotations, not committed - this repository is public.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "75"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS: ${{ inputs.days }}
        run: python traffic_sources.py > report.txt 2>&1 || true
      - name: Forward report as annotations
        run: |
          python - <<'PY'
          t = open("report.txt", encoding="utf-8", errors="replace").read()
          chunks = [t[i:i+3500] for i in range(0, len(t), 3500)][:10]
          for n, c in enumerate(chunks, 1):
              enc = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=traffic part {n} of {len(chunks)}::{enc}")
          PY
