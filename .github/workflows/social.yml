name: social-post

# One Instagram post a day: today's gold rate card (social_post.py). The card
# is committed to the repo first, because Instagram fetches the image from a
# public URL (raw.githubusercontent.com), then posted with Meta's free API.
# With GEMINI_API_KEY the background is a fresh AI jewellery photo (the
# numbers are always drawn by the code). Without IG_ACCESS_TOKEN it only
# builds the card.
on:
  schedule:
    - cron: "47 5 * * *"   # 05:47 UTC ~ 11:17 IST, after the morning rates have settled
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (build the card only), check (is Instagram connected?) or post"
        default: "preview"

permissions:
  contents: write

concurrency:
  group: social-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests supabase

      - name: Check the Instagram connection
        if: inputs.mode == 'check'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python social_post.py check

      - name: Build the card
        if: inputs.mode != 'check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: the day's jewellery photo
          USEAPI_TOKEN: ${{ secrets.USEAPI_TOKEN }}       # optional: Google Flow via useapi.net, tried first
        run: python social_post.py build

      - name: Publish the card to the repo
        if: inputs.mode != 'check'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/social
          git commit -m "Instagram card $(TZ=Asia/Kolkata date +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Post to Instagram
        if: github.event_name == 'schedule' || inputs.mode == 'post'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          D=$(TZ=Asia/Kolkata date +%F)
          # the exact commit, so a cached copy of an earlier card under the same name is never posted
          git fetch -q origin main && SHA=$(git rev-parse origin/main)
          python social_post.py publish "https://raw.githubusercontent.com/${{ github.repository }}/$SHA/docs/social/rates-$D.jpg"
          git add docs/social/posted.json 2>/dev/null || true
          git commit -m "Instagram posted $D" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
