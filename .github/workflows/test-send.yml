name: test-send
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Recipient email for the test digest"
        required: true

jobs:
  testsend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests supabase
      - name: Send test digest
        env:
          TEST_EMAIL: ${{ inputs.email }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_send.py
