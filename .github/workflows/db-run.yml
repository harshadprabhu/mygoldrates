name: db-run

# Runs one SQL file from this repository's sql/ folder against the Supabase
# database, so schema changes no longer need copying into the SQL Editor by
# hand. Manual only.
#
# Credentials, either of (values are never printed):
#  - a Postgres connection string, e.g. SUPABASE_DB_URL: Supabase -> Connect ->
#    "Session pooler" (IPv4; GitHub runners cannot reach the direct IPv6-only
#    address), password filled in. Other common names are accepted too.
#  - a Supabase personal access token, e.g. SUPABASE_ACCESS_TOKEN, used with
#    the Management API's SQL endpoint.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "SQL file to run (must be under sql/)"
        default: "sql/analytics_report.sql"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the file
        env:
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in
            sql/*.sql) ;;
            *) echo "::error::only files under sql/ ending in .sql"; exit 1;;
          esac
          case "$FILE" in *..*) echo "::error::no .. in the path"; exit 1;; esac
          test -f "$FILE" || { echo "::error::$FILE not found"; exit 1; }
      # Which secrets exist (names only - values are never printed). The
      # connection can come from a Postgres connection string under any of
      # the usual names, or from a Supabase personal access token through
      # the Management API's query endpoint.
      - name: Find credentials
        id: creds
        env:
          C1: ${{ secrets.SUPABASE_DB_URL }}
          C2: ${{ secrets.DATABASE_URL }}
          C3: ${{ secrets.SUPABASE_DATABASE_URL }}
          C4: ${{ secrets.SUPABASE_DB }}
          C5: ${{ secrets.DB_URL }}
          C6: ${{ secrets.POSTGRES_URL }}
          C7: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          C8: ${{ secrets.SUPABASE_POOLER_URL }}
          T1: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          T2: ${{ secrets.SUPABASE_TOKEN }}
          T3: ${{ secrets.SUPABASE_PAT }}
          T4: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          P1: ${{ secrets.SUPABASE_DB_PASSWORD }}
          P2: ${{ secrets.DB_PASSWORD }}
          P3: ${{ secrets.SUPABASE_PASSWORD }}
          SK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          names="C1:SUPABASE_DB_URL C2:DATABASE_URL C3:SUPABASE_DATABASE_URL C4:SUPABASE_DB C5:DB_URL C6:POSTGRES_URL C7:SUPABASE_CONNECTION_STRING C8:SUPABASE_POOLER_URL T1:SUPABASE_ACCESS_TOKEN T2:SUPABASE_TOKEN T3:SUPABASE_PAT T4:SUPABASE_MANAGEMENT_TOKEN P1:SUPABASE_DB_PASSWORD P2:DB_PASSWORD P3:SUPABASE_PASSWORD"
          found=""
          for pair in $names; do
            v="${pair%%:*}"; n="${pair#*:}"
            if [ -n "$(printenv "$v")" ]; then found="$found $n"; fi
          done
          echo "::notice title=db-run credentials::secrets present:${found:- none of the expected names}"
          url=""; for v in C1 C2 C3 C4 C5 C6 C7 C8; do [ -z "$url" ] && url="$(printenv $v || true)"; done
          tok=""; for v in T1 T2 T3 T4; do [ -z "$tok" ] && tok="$(printenv $v || true)"; done
          if [ -n "$url" ]; then echo "mode=psql" >> "$GITHUB_OUTPUT"
          elif [ -n "$tok" ]; then echo "mode=api" >> "$GITHUB_OUTPUT"
          elif [ -n "$SK" ]; then echo "mode=service" >> "$GITHUB_OUTPUT"
          else echo "mode=none" >> "$GITHUB_OUTPUT"; fi

      - name: Run (connection string)
        if: steps.creds.outputs.mode == 'psql'
        env:
          FILE: ${{ inputs.file }}
          C1: ${{ secrets.SUPABASE_DB_URL }}
          C2: ${{ secrets.DATABASE_URL }}
          C3: ${{ secrets.SUPABASE_DATABASE_URL }}
          C4: ${{ secrets.SUPABASE_DB }}
          C5: ${{ secrets.DB_URL }}
          C6: ${{ secrets.POSTGRES_URL }}
          C7: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          C8: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          url=""; for v in C1 C2 C3 C4 C5 C6 C7 C8; do [ -z "$url" ] && url="$(printenv $v || true)"; done
          sudo apt-get install -y -qq postgresql-client >/dev/null
          set +e
          psql "$url" -v ON_ERROR_STOP=1 -X -q -f "$FILE" > out.txt 2>&1
          code=$?
          set -e
          echo "$code" > code.txt

      - name: Run (Supabase access token)
        if: steps.creds.outputs.mode == 'api'
        env:
          FILE: ${{ inputs.file }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          T1: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          T2: ${{ secrets.SUPABASE_TOKEN }}
          T3: ${{ secrets.SUPABASE_PAT }}
          T4: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          tok = next(os.environ[k] for k in ("T1", "T2", "T3", "T4") if os.environ.get(k))
          ref = re.match(r"https://([a-z0-9]+)\.supabase\.co", os.environ["SUPABASE_URL"]).group(1)
          sql = open(os.environ["FILE"], encoding="utf-8").read()
          # psql meta-commands (\pset ...) are not SQL; drop them for the API.
          sql = "\n".join(l for l in sql.splitlines() if not l.lstrip().startswith("\\"))
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  out, code = r.read().decode(), 0
          except urllib.error.HTTPError as e:
              out, code = f"HTTP {e.code}: {e.read().decode()[:2000]}", 1
          open("out.txt", "w").write(out)
          open("code.txt", "w").write(str(code))
          PY

      # Last resort: the project's own SQL endpoint with the service key (the
      # one the site's jobs already use), where the project exposes it.
      - name: Run (service key)
        if: steps.creds.outputs.mode == 'service'
        env:
          FILE: ${{ inputs.file }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          sql = open(os.environ["FILE"], encoding="utf-8").read()
          sql = "\n".join(l for l in sql.splitlines() if not l.lstrip().startswith("\\"))
          base, k = os.environ["SUPABASE_URL"].rstrip("/"), os.environ["SK"]
          out, code = "", 1
          for path in ("/pg/query", "/pg-meta/default/query"):
              req = urllib.request.Request(base + path, data=json.dumps({"query": sql}).encode(), method="POST",
                  headers={"apikey": k, "Authorization": f"Bearer {k}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      out, code = r.read().decode(), 0
                  break
              except urllib.error.HTTPError as e:
                  out += f"{path}: HTTP {e.code}: {e.read().decode()[:300]}\n"
          open("out.txt", "w").write(out)
          open("code.txt", "w").write(str(code))
          PY

      - name: Report
        if: always()
        env:
          MODE: ${{ steps.creds.outputs.mode }}
        run: |
          if [ "$MODE" = "none" ]; then
            echo "::error::No database credentials found. Add SUPABASE_DB_URL (session pooler connection string) or SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          code=$(cat code.txt 2>/dev/null || echo 1)
          python3 - "$code" <<'PY'
          import sys
          t = open("out.txt", encoding="utf-8", errors="replace").read()[-3400:] if __import__("os").path.exists("out.txt") else "(no output)"
          enc = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          kind = "notice" if sys.argv[1] == "0" else "error"
          print(f"::{kind} title=db-run exit {sys.argv[1]}::{enc}")
          PY
          exit $code
