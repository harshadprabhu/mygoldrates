name: diag-bluestone-mc

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: BlueStone price-breakup section dump + extractor test
        run: |
          python - <<'PY'
          import re, requests

          PRODUCTS = [
            ("Bangle",   "https://www.bluestone.com/bangles/the-orrale-round-bangle~79884.html"),
            ("Bangle",   "https://www.bluestone.com/bangles/the-estrella-oval-bangle~34771.html"),
            ("Ring",     "https://www.bluestone.com/preset+solitaire+rings/the-aphaea-ring-for-him~83508.html"),
            ("Ring",     "https://www.bluestone.com/rings/the-petillante-ring~86191.html"),
            ("Ring",     "https://www.bluestone.com/rings/the-dimas-textured-band-for-her~81692.html"),
            ("Earrings", "https://www.bluestone.com/earrings/the-mathilda-drop-earrings~8976.html"),
            ("Earrings", "https://www.bluestone.com/earrings/the-marianna-stud-earrings~67286.html"),
            ("Earrings", "https://www.bluestone.com/earrings/the-rua-stud-earrings~60693.html"),
          ]

          sess = requests.Session()
          sess.headers.update({"User-Agent":
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
            "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"})

          # BlueStone renders the breakup as an HTML table inside
          # <section id="section-price-breakup">, with values in
          # <span id="XxxCost_b">12,345</span> cells.
          SECTION_RE = re.compile(
            r'<section id="section-price-breakup".*?</section>', re.I | re.S)
          # id -> amount, e.g. goldCost_b -> 79,234
          COST_RE = re.compile(
            r'id="([A-Za-z_]+?Cost_b)"[^>]*>\s*([\d,]+(?:\.\d+)?)', re.I)
          # row label -> amount, as a fallback if the ids change
          ROW_RE = re.compile(
            r'<td[^>]*item-type-title"?[^>]*>\s*([^<]{2,40}?)\s*</td>.*?'
            r'([\d,]+(?:\.\d+)?)\s*</span>', re.I | re.S)

          def strip_tags(s):
            return re.sub(r"<[^>]+>", " ", s)

          rows = []
          for i, (cat, url) in enumerate(PRODUCTS, 1):
            short = url.rsplit("/",1)[-1][:50]
            try:
              r = sess.get(url, timeout=25)
              html = r.text if r.status_code == 200 else None
            except Exception as e:
              html = None
            if not html:
              print(f"\n[{i}] {cat} {short}: FETCH FAIL"); continue

            sec = SECTION_RE.search(html)
            if not sec:
              print(f"\n[{i}] {cat} {short}: no price-breakup section")
              rows.append((cat, short, "NO_SECTION", {})); continue
            block = sec.group(0)

            costs = {m.group(1): m.group(2) for m in COST_RE.finditer(block)}
            labels = {}
            for m in ROW_RE.finditer(block):
              lab = m.group(1).strip().lower()
              if lab and lab not in labels:
                labels[lab] = m.group(2)

            print(f"\n[{i}] {cat} {short}: section len={len(block)}")
            print(f"    cost ids: {costs}")
            print(f"    row labels: {labels}")

            # On the first product, show the section as plain text so the
            # exact row order/wording is visible for writing the extractor.
            if i == 1:
              txt = re.sub(r"\s+", " ", strip_tags(block)).strip()
              print(f"    PLAINTEXT: {txt[:700]}")

            # Try to compute making% from whatever we found
            def pick(d, *keys):
              for k in keys:
                for dk, dv in d.items():
                  if k in dk.lower():
                    return dv
              return None

            gold   = pick(costs, "gold") or pick(labels, "gold")
            making = pick(costs, "making") or pick(labels, "making")
            pct = None
            if gold and making:
              try:
                g = float(gold.replace(",","")); mk = float(making.replace(",",""))
                if g > 0 and 0 < mk/g <= 1.0:
                  pct = round(mk/g*100, 1)
              except ValueError: pass
            print(f"    gold={gold} making={making} -> making% = {pct}")
            rows.append((cat, short, "OK" if pct else "MISS",
                          {"gold": gold, "making": making, "pct": pct}))

          print("\n\n============ BLUESTONE SUMMARY ============")
          for cat, short, status, d in rows:
            print(f"{cat:<10} {status:<11} {str(d)[:70]}")
          ok = sum(1 for r in rows if r[2] == "OK")
          print(f"\nBlueStone: {ok}/{len(rows)} products yielded a making %")
          PY
