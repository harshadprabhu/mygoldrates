name: diag-bluestone-mc

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: BlueStone making-charge discovery
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          CRAWLBASE_KEY: ${{ secrets.CRAWLBASE_KEY }}
        run: |
          python - <<'PY'
          import os, re, requests

          # Product URLs the user supplied (bracelet is v2 cat - kept to compare shapes)
          PRODUCTS = [
            ("Bangle",   "https://www.bluestone.com/bangles/the-orrale-round-bangle~79884.html"),
            ("Bangle",   "https://www.bluestone.com/bangles/the-estrella-oval-bangle~34771.html"),
            ("Bracelet", "https://www.bluestone.com/bracelets/the-leoneil-bracelet~63773.html"),
            ("Ring",     "https://www.bluestone.com/preset+solitaire+rings/the-aphaea-ring-for-him~83508.html"),
            ("Ring",     "https://www.bluestone.com/rings/the-petillante-ring~86191.html"),
            ("Ring",     "https://www.bluestone.com/rings/the-dimas-textured-band-for-her~81692.html"),
            ("Earrings", "https://www.bluestone.com/earrings/the-mathilda-drop-earrings~8976.html"),
            ("Earrings", "https://www.bluestone.com/earrings/the-marianna-stud-earrings~67286.html"),
            ("Earrings", "https://www.bluestone.com/earrings/the-rua-stud-earrings~60693.html"),
          ]

          sess = requests.Session()
          sess.headers.update({"User-Agent":
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
            "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"})

          def _proxies(url):
            for k_env, name, u, p in [
              ("SCRAPERAPI_KEY","scraperapi","http://api.scraperapi.com",
                {"url":url,"render":"true","country_code":"in"}),
              ("SCRAPINGBEE_KEY","scrapingbee","https://app.scrapingbee.com/api/v1/",
                {"url":url,"render_js":"true","wait":"3000"}),
              ("ZENROWS_KEY","zenrows","https://api.zenrows.com/v1/",
                {"url":url,"js_render":"true","wait":"3000"}),
              ("CRAWLBASE_KEY","crawlbase","https://api.crawlbase.com/",{"url":url}),
            ]:
              k = os.environ.get(k_env)
              if not k: continue
              p2 = dict(p); p2["api_key" if name != "crawlbase" else "token"] = k
              if name == "zenrows": p2["apikey"] = p2.pop("api_key")
              yield name, u, p2

          def fetch(url):
            try:
              r = sess.get(url, timeout=25)
              if r.status_code == 200 and len(r.text) > 500:
                return r.text, "direct"
            except Exception: pass
            for name, u, p in _proxies(url):
              try:
                r = sess.get(u, params=p, timeout=60)
                if r.status_code == 200 and len(r.text) > 500:
                  return r.text, name
              except Exception: continue
            return None, "all-failed"

          # Money-ish tokens to hunt for near making-charge words
          RUPEE = r'(?:Rs\.?|\\u20b9|₹|INR)\.?\s*([\d,]+(?:\.\d+)?)'

          # Candidate label->value patterns (label first, then a rupee amount
          # within a short window that may include HTML tags)
          LABELS = [
            ("making",     r'(?:making\s*charges?|makingcharge)'),
            ("metal",      r'(?:metal\s*(?:value|price|cost)|gold\s*(?:value|price|cost))'),
            ("stone",      r'(?:stone\s*(?:value|price|cost)|diamond\s*(?:value|price|cost))'),
            ("gst",        r'(?:gst|tax)'),
            ("total",      r'(?:grand\s*total|total\s*(?:price|amount))'),
          ]

          def probe(html):
            """Report every label we can find with a nearby rupee amount."""
            out = {}
            for name, lab in LABELS:
              m = re.search(lab + r'[\s\S]{0,300}?' + RUPEE, html, re.I)
              if m:
                out[name] = m.group(1)
            return out

          def ctx_dump(html, pat, width=260, label=""):
            m = re.search(pat, html, re.I)
            if not m:
              return f"    [{label}] not found"
            s = max(0, m.start()-60); e = min(len(html), m.end()+width)
            snippet = html[s:e].replace("\n", " ")
            return f"    [{label}] @{m.start()}: ...{snippet}..."

          rows = []
          for i, (cat, url) in enumerate(PRODUCTS, 1):
            short = url.rsplit("/",1)[-1][:52]
            html, src = fetch(url)
            if not html:
              print(f"\n[{i}] {cat} {short}: FETCH FAIL ({src})")
              rows.append((cat, short, "FETCH_FAIL", {}, src)); continue

            vals = probe(html)
            pct = None
            if "making" in vals and "metal" in vals:
              try:
                mk = float(vals["making"].replace(",",""))
                mt = float(vals["metal"].replace(",",""))
                if mt > 0 and 0 < mk/mt <= 1.0:
                  pct = round(mk/mt*100, 1)
              except ValueError: pass

            print(f"\n[{i}] {cat} {short}: via {src}, len={len(html)}")
            print(f"    labels found: {vals}  -> making% = {pct}")

            # On the first couple of products, dump raw context so I can see
            # the real DOM/JSON shape and write a precise extractor.
            if i <= 2:
              print(ctx_dump(html, r'making\s*charges?', label="making"))
              print(ctx_dump(html, r'metal\s*(?:value|price)', label="metal"))
              print(ctx_dump(html, r'price\s*break', label="pricebreak"))
              print(ctx_dump(html, r'"priceBreakup"|"price_breakup"|priceBreakUp',
                             label="jsonbreakup"))
            rows.append((cat, short, "OK" if pct else "MISS", vals, src))

          print("\n\n============ BLUESTONE SUMMARY ============")
          print(f"{'Cat':<10} {'Status':<10} {'Labels':<40} {'Src':<12}")
          for cat, short, status, vals, src in rows:
            print(f"{cat:<10} {status:<10} {str(sorted(vals))[:38]:<40} {src:<12}")
          ok = sum(1 for r in rows if r[2] == "OK")
          print(f"\nBlueStone: {ok}/{len(rows)} products yielded a making %")
          PY
